version: 2

builds:
  - id: proxy
    dir: proxy
    main: ./cmd
    binary: mcpx-proxy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

  - id: git
    dir: servers/git
    main: ./cmd
    binary: mcpx-git
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

  - id: code
    dir: servers/code
    main: ./cmd
    binary: mcpx-code
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - id: bundle
    builds: [proxy, git, code]
    name_template: "mcpx_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - src: proxy/gateway.yaml
        dst: gateway.yaml

checksum:
  name_template: "mcpx_{{ .Version }}_checksums.txt"

release:
  github:
    owner: nqhuy44
    name: mcpx
  name_template: "v{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
