name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: |
            proxy/go.sum
            servers/exec/go.sum
            servers/debug/go.sum

      - name: test
        run: |
          for mod in proxy servers/exec servers/debug; do
            echo "test $mod"
            (cd "$mod" && go test ./...)
          done

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
